<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <defs>
    <!-- Trend Arrow Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Emerald Financial Gradient -->
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Subtle Icon Glow / Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Logo Mark / Icon Graphic -->
  <g transform="translate(10, 10)" filter="url(#softGlow)">
    <!-- Sleek Rounded Hexagon / Shield Container -->
    <polygon points="50,5 95,28 95,74 50,97 5,74 5,28" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    
    <!-- Financial Growth Bar Chart Layer -->
    <rect x="20" y="56" width="10" height="26" rx="2" fill="url(#finGrad)" />
    <rect x="35" y="40" width="10" height="42" rx="2" fill="url(#finGrad)" />
    <rect x="50" y="26" width="10" height="56" rx="2" fill="url(#finGrad)" />

    <!-- Trend Arrow Overlay -->
    <path d="M 18 48 Q 42 16 76 13" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" />
    <polygon points="73,8 84,14 75,21" fill="#f97316" />
  </g>

  <!-- Typography / Brand Name (Adaptive for Light & Dark UI) -->
  <g transform="translate(130, 72)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="currentColor" class="brand-text" letter-spacing="0.5">
      Spend<tspan fill="#34d399">Flow</tspan>
    </text>
  </g>
</svg>
